# Render Blueprint — SmartRail (added 2026-10-31 for hosting)
# If you create the Web Service manually instead, use the same values:
#   Build command: npm install
#   Start command: npm start
# Env vars marked sync:false are typed in by you in the Render
# dashboard — never commit real values to GitHub.
services:
  - type: web
    name: smartrail
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false        # your Atlas connection string (with /smart-train-db)
      - key: JWT_SECRET
        sync: false        # the long random secret Muse generated for you
      - key: DEVICE_API_KEY
        sync: false        # same value goes in the firmware + ML script
      - key: SEED_DEMO_USERS
        value: "true"      # first deploy only, so you can log in; lockdown step turns this off after you create your own DOM account and delete the seed users in Atlas
      - key: NODE_STATION_NAME
        value: Mysuru
      - key: NODE_SECTION_ID
        value: section-1
